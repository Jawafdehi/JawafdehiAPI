# Per-case tag corrections, applied by `rebuild_case_tags` on top of the alias map.
#
# The alias map is mechanical: it can only say what a raw string means. It cannot
# add a tag the case never carried, and it cannot fix one case without changing
# every case that shares the alias. This file is where those two things happen.
#
# EVERY entry needs a `why` naming the evidence — the command rejects a blank one.
# The evidence is the case's own title in almost every case here; where it is not,
# the `why` says so.
#
# `add` is not "a tag that seems right". It is a fact stated in the record:
#   थाहा नगरपालिका in the title  ->  local-government
#   गण्डकी प्रदेश ... मन्त्रालय   ->  province-government
# Two systematic gaps account for nearly all of it: of the 31 cases that end with
# fewer than 3 tags, 28 lack a governance level and 22 lack geography. Almost none
# lack an offence or a sector.
#
# NOT curated to hit a tag count. Curated because a reader currently cannot filter
# half the corpus by province.

