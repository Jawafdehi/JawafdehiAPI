# Jawafdehi case tag vocabulary — seed candidate
#
# Derived entirely from the 144 distinct raw values currently in `Case.tags`
# across the 82 published cases (462 assignments), read 2026-08-24.
# Implements docs/jawafdehi-search/design.md §12: a single flat vocabulary.
# No axes — a tag is a tag.
#
# The one structural relationship is `broader`. A tag may name a broader tag it
# rolls up into. The case record stores only the specific tag; the indexer also
# writes every broader tag, so filtering by `land` returns all land cases while
# filtering by `land-grab` returns only the ones where land was actually seized.
# Three groups use it: land, procurement, revenue.
#
# Alias keys are stored ALREADY NORMALIZED. A raw value is matched by running
# it through the normalizer in normalize.py and looking the result up here:
#
#   1. Unicode NFC
#   2. Devanagari repair: ा+े (U+093E U+0947) -> ो (U+094B), ा+ै -> ौ
#      (Preeti-conversion artefact; 2 live tags carry it and can never match
#      a correctly typed query)
#   3. collapse internal whitespace, trim
#   4. strip leading/trailing punctuation
#   5. map '-' and '_' to space
#   6. casefold
#
# Nothing outside this file becomes a public filter. Raw values that match no
# alias are listed under `dropped:` with a reason.
#
# The `# ---` section headers below are file organisation only, to keep 51 terms
# readable. They are not a schema and are not loaded.

version: 1
source: 82 published cases / 144 distinct raw values / 462 assignments (2026-08-24)
# Geography is the OFFICIAL list, not corpus-derived: 7 provinces + 73 districts +
# Nawalparasi and Rukum kept whole. Unused terms cost nothing — zero-count buckets
# never reach a facet, since the list comes from the aggregation, not this table.

tags:

  # --- what is alleged ----------------------------------------------------
  - id: procurement
    label_ne: सार्वजनिक खरिद
    label_en: Public Procurement
    status: active
    aliases: [procurement, public procurement]
    note: >-
      The domain, asserting no wrongdoing on its own — the raw values `Procurement`
      and `Public Procurement` say only that a case concerns purchasing. Cases where
      irregularity IS alleged carry `procurement-irregularity` and roll up to here.

  - id: procurement-irregularity
    label_ne: सार्वजनिक खरिद अनियमितता
    label_en: Procurement Irregularity
    status: active
    broader: procurement
    aliases: [procurement irregularities, procurement splitting, high specification]
    note: >-
      `procurement splitting` (टुक्रा पारी खरिद) and `high specification` are specific
      malpractices with 1 use each; folded in to keep the list tight. Promote to their
      own tags if they recur.

  - id: bid-rigging
    label_ne: बोलपत्रमा मिलेमतो
    label_en: Bid Rigging
    status: active
    broader: procurement
    aliases: [bid rigging]
    note: Kept separate from procurement-irregularity — use where collusion is specifically alleged.

  - id: illicit-enrichment
    label_ne: स्रोत नखुलेको सम्पत्ति आर्जन
