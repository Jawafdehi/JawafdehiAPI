# ---------------------------------------------------------------------------
# Dropped — raw values that become no canonical tag.
#
# These are seeded as alias rows with a NULL tag, so `?tags=CIAA` can answer
# "that filter was retired" instead of "unknown tag". A stale bookmark getting a
# flat error reads as a bug; this is the difference.
# ---------------------------------------------------------------------------
dropped:

  - reason: not-a-tag-money-amount
    note: One per case, never repeats. Belongs in the existing bigo/amount field.
    values:
      ["~1 Crore 25 Lakh", "~1 Crore 31 Lakh", "~1 Crore 55 Lakh", "~1 Crore 61 Lakh",
       "~1 Crore 8 Lakh", "~17 Crore 98 Lakh", "~2 Crore 89 Lakh", "~21 Crore 21 Lakh",
       "~26 Lakh 82 Hazar", "~3 Crore 15 Lakh", "~3 Crore 21 Lakh", "~3 Crore 29 Lakh",
       "~3 Lakh 20 Hazar", "~34 Crore 66 Lakh", "~4 Crore 67 Lakh", "~45 Hazar",
       "~5 Crore 33 Lakh", "~5 Crore 5 Lakh", "~6 Arab 21 Crore", "~85 Lakh 18 Hazar",
       "~9 Lakh 13 Hazar", "~1 Arab 47 Crore", "~2 Arab 37 Crore"]

  - reason: not-a-tag-case-number
    note: Already carried by the court-case reference, and normalized there (§6.3).
    values: ["081-CR-0098", "081-CR-0111"]

  - reason: duplicates-an-existing-structured-field
    note: >-
      `Corruption` restates case_type, which is already its own facet. `CIAA` is the
      filer in 53 of 82 cases and `Special Court`/`Supreme Court` are the venue — all
      three come from the court-case reference and discriminate almost nothing as
      facets. 110 of the 462 live assignments, removed with no loss.

      `भ्रष्टाचार` is the same call in Nepali, and by volume it is the bigger one: it
      sits on 2685 of the unpublished CIAA cases, where it is the *only* tag on most
      of them. Dropping it is consistent — it restates a CORRUPTION case_type — but it
      is why those cases cannot be canonicalised into a useful state by the alias map
      alone, and why the rebuild is scoped to published cases until they have real
      offence tags.
    values: ["Corruption", "Corruption Allegation", "CIAA", "Special Court", "Supreme Court",
             "भ्रष्टाचार"]

  - reason: named-person-or-organisation
    note: >-
      Named bodies and people already exist as entity relations (§6.4); duplicating
      them as free text is how NITC/nphl/sashikanta jha ended up in the tag field.
      Naming an individual in a tag also implies a finding of guilt the tag field has
      no business asserting. Where an institution name implied a domain unambiguously
      it was aliased there instead (nphl -> health, NTC -> telecommunications); these
      carry no such signal.
    values: ["K.P. Sharma Oli", "Prime Minister of Nepal", "sashikanta jha", "झलक शर्मा पौडेल",
             "RSP", "Giribandhu", "Pashupati Jalahari", "Kathmandu Valley Development Authority",
             "महालेखा परीक्षक", "ICISD"]

  - reason: editorial-or-too-vague
    note: >-
      `Unsubstantiated Claim` and `Stalled Investigation` are judgements, not
      classifications — the latter wants a case-status field, which this vocabulary
      does not model. `Civil Servant(s)` describes the accused's role and is carried
      by entity relations.
    values: ["Unsubstantiated Claim", "Stalled Investigation", "Political Corruption",
             "national issue", "Irregular Amount", "Bagmati Mayor Involvement",
             "Maoist Combatants", "Peace Process", "Civil Servant", "Civil Servants"]

  - reason: below-district-granularity-or-ambiguous
    note: >-
      `baluwatar` is genuinely ambiguous — the Kathmandu locality of the Lalita Niwas
      case, or a locality inside Damak; its case is the Damak land case, so neither
      reading is safe. `माछापाेखरी` is an unresolvable pond/locality name.
    values: ["baluwatar", "माछापाेखरी"]

  - reason: not-a-tag-test-data
    note: >-
      Test artefacts that reached the production cases table and are sitting in
      `Case.tags` today: `bugbash` and `practice` on 14 cases each, plus one `Test`
      and one `MCP-Verification`. Recorded here so the rebuild reports them as
      deliberately retired rather than as vocabulary gaps — but the tags are the
      symptom, not the problem. The cases themselves want deleting.
    values: ["bugbash", "practice", "Test", "MCP-Verification"]

  - reason: not-a-tag-case-name
    note: >-
      A label for one specific case, not a class of cases. `wide body` and `aircraft`
      are the Nepal Airlines wide-body procurement case; a tag that matches exactly
      one case is a worse version of a link to it. Distinct from
      `named-person-or-organisation`: nobody is being named here, so the guilt-implication
      argument does not apply — these are simply not facets.
    values: ["Bhatta-Agrawal Syndicate", "Reinsurance Share Rigging", "wide body", "aircraft"]

