[project]
name = "nes-service"
version = "0.1.0"
description = "NES (Nepal Entity Service) — Django/DRF service over a schema.org JSON-LD entity store keyed by @id IRI (publication/bulk-ingest)."
requires-python = ">=3.12"
# NES's OWN dependencies only. A service image installs just these + shared,
# not the other services' deps (per the per-service-isolation decision).
dependencies = [
    "jawafdehi-shared",          # workspace source: OIDC auth, entity-id, DRF bases
    "django>=5.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",      # Postgres (nes DB)
    "dj-database-url>=2.2",       # parse NES_DB_URL → DATABASES
    "gunicorn>=23.0",
    # RFC-6902 JSON Patch for PATCH /api/entities/{id}.
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
search = ["jawafdehi-shared[search]"]

[tool.uv.sources]
jawafdehi-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nes_service"]
