[project]
name = "ngm-service"
version = "0.1.0"
description = "NGM (Nepal Government Modernization) — Django/DRF service over the governance/judicial data + lakehouse."
requires-python = ">=3.12"
# NGM's OWN dependencies only. A service image installs just these + shared,
# not the other services' deps (per the per-service-isolation decision).
dependencies = [
    "jawafdehi-shared",          # workspace source: OIDC auth, entity-id, DRF bases
    "django>=5.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",      # Postgres (ngm DB)
    "dj-database-url>=2.2",       # parse NGM_DATABASE_URL → DATABASES
    "gunicorn>=23.0",
    # Lakehouse query engine (embedded) + object storage. Kept on the NGM service
    # only — NES/Jawafdehi don't carry DuckDB.
    "duckdb>=1.4.0",
    "boto3>=1.34",               # R2/S3 access for bronze + Iceberg data files
]

[project.optional-dependencies]
search = ["jawafdehi-shared[search]"]

[tool.uv.sources]
jawafdehi-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngm_service"]
