# Builds the v2 platform image docker.io/jawafdehi/jawafdehi-platform from this branch (the repo IS
# the platform after the wholesale port). Keel watches the mutable :v2 tag and rolls it onto the
# jawafdehi-platform Deployment (api.jawafdehi.org). Mirrors the legacy docker-publish.yml's pinned
# actions + DockerHub secrets.
name: Docker Publish (platform)
on:
  push:
    branches: ['v2']
    tags: ['v*']
  pull_request:
    branches: ['v2']
  workflow_dispatch: {}
env:
  REGISTRY: docker.io
  IMAGE_NAME: jawafdehi/jawafdehi-platform
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: docker/setup-qemu-action@eaefd20f597840d8870070b5b0e1bd33d2fff867
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Log into DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
