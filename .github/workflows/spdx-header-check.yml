# SPDX-License-Identifier: LicenseRef-Hippocratic-3.0

name: SPDX License Header Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only reads the tree. Nothing here writes to the repository, comments
# on a pull request, or publishes anything.
permissions:
  contents: read

jobs:
  spdx-check:
    name: Check SPDX License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check LICENSE file
        env:
          # SHA-256 of the licence text this repository ships. Pinning the whole
          # file, rather than grepping for a title line, is what makes this a real
          # gate: a LICENSE that is deleted, truncated, or quietly reworded fails
          # CI instead of passing because the words "Hippocratic License Version
          # 3.0" happen to appear somewhere in it.
          #
          # Changing the licence is a deliberate act. When you do, update this
          # digest in the same commit: sha256sum LICENSE
          EXPECTED_LICENSE_SHA256: ed50522c2789733ecf6bbd54fc664e449f66998c8e40a4a80c8d1f007f0c39d3
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file is missing"
            exit 1
          fi
          ACTUAL=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED_LICENSE_SHA256" ]; then
            echo "::error::LICENSE does not match the pinned licence text"
            echo "  expected sha256: $EXPECTED_LICENSE_SHA256"
            echo "  actual sha256:   $ACTUAL"
            echo "  If the licence change is intended, update EXPECTED_LICENSE_SHA256 in this workflow."
            exit 1
          fi
          echo "LICENSE file OK (matches the pinned licence text)"

      - name: Check SPDX headers in source files
        run: |
          HEADER_FILES=$(git ls-files \
            '*.py' '*.js' '*.ts' '*.tsx' '*.rs' '*.go' '*.java' '*.rb' \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.css' '*.scss' \
            '*.html' '*.sql' '*.tf' 'Dockerfile*' \
            2>/dev/null || true)

          if [ -z "$HEADER_FILES" ]; then
            echo "No source files found to check."
            exit 0
          fi

          MISSING=0
          TOTAL=0
          while IFS= read -r file; do
            TOTAL=$((TOTAL + 1))
            if head -20 "$file" 2>/dev/null | grep -qi "SPDX-License-Identifier"; then
              continue
            else
              echo "::warning title=Missing SPDX header::$file"
              MISSING=$((MISSING + 1))
            fi
          done <<< "$HEADER_FILES"

          echo "---"
          echo "Files checked: $TOTAL"
          echo "Files with SPDX header: $((TOTAL - MISSING))"
          echo "Files missing SPDX header: $MISSING"

          if [ "$MISSING" -gt 0 ]; then
            echo "::warning:: $MISSING source files are missing SPDX license headers"
          fi
          echo "SPDX header scan complete."

      # Hippocratic 3.0 is not on the SPDX License List, so the only spec-valid
      # way to name it is the LicenseRef- form. That is what pyproject.toml's
      # `license` field already declares, and headers must agree with it.
      - name: Verify SPDX identifier is LicenseRef-Hippocratic-3.0
        run: |
          IDENTIFIER_FILES=$(git ls-files \
            '*.py' '*.js' '*.ts' '*.tsx' '*.rs' '*.go' '*.java' '*.rb' \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.css' '*.scss' \
            '*.html' '*.sql' '*.tf' 'Dockerfile*' \
            2>/dev/null || true)

          if [ -z "$IDENTIFIER_FILES" ]; then
            echo "No source files to verify SPDX identifier against."
            exit 0
          fi

          MISMATCH=0
          TOTAL=0
          while IFS= read -r file; do
            LINE=$(head -20 "$file" 2>/dev/null | grep -i "SPDX-License-Identifier" | head -1 || true)
            if [ -n "$LINE" ]; then
              TOTAL=$((TOTAL + 1))
              # Compare the declared expression exactly, not as a substring: a
              # substring match would wave through `LicenseRef-Hippocratic-3.00`
              # and `LicenseRef-Hippocratic-3.0 OR MIT`, neither of which is the
              # identifier this repository requires.
              #
              # The tag holds no colon of its own, so everything after the first
              # colon is the expression, whatever comment marker opened the line.
              VALUE="${LINE#*:}"
              VALUE="${VALUE%%-->*}"      # <!-- ... --> (html, xml)
              VALUE="${VALUE%%\*/*}"      # /* ... */    (css, scss, java, go)
              VALUE="${VALUE#"${VALUE%%[![:space:]]*}"}"
              VALUE="${VALUE%"${VALUE##*[![:space:]]}"}"
              if [ "$VALUE" != "LicenseRef-Hippocratic-3.0" ]; then
                echo "::warning title=Non-HL3 SPDX identifier::$file"
                echo "  Found: $VALUE"
                MISMATCH=$((MISMATCH + 1))
              fi
            fi
          done <<< "$IDENTIFIER_FILES"

          echo "---"
          echo "Files with SPDX identifiers checked: $TOTAL"
          echo "Non-HL3 identifiers found: $MISMATCH"
          if [ "$MISMATCH" -gt 0 ]; then
            echo "::warning:: $MISMATCH file(s) use a SPDX identifier other than LicenseRef-Hippocratic-3.0"
          fi

      - name: Verify governance files exist
        run: |
          MISSING_GOV=0
          for f in SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing"
              MISSING_GOV=$((MISSING_GOV + 1))
            else
              echo "$f present"
            fi
          done
          if [ "$MISSING_GOV" -gt 0 ]; then
            echo "::error:: $MISSING_GOV governance file(s) missing"
            exit 1
          fi
