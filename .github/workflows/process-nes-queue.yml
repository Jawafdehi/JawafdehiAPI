# GitHub Actions workflow for processing the NES Queue System (NESQ).
#
# This workflow:
# 1. Runs daily at midnight UTC via cron schedule
# 2. Checks out both jawafdehi-api and nes-db repositories
# 3. Starts a Cloud SQL Proxy to connect to the database securely
# 4. Runs the Django process_queue management command to process APPROVED items
# 5. Commits and pushes any resulting nes-db file changes
#
# The management command processes approved NESQueueItems via the NES
# PublicationService, writing entity changes to the nes-db FileDatabase.
# Git operations (add, commit, push) are handled here as shell steps,
# NOT in the Python processor.
#
# Required secrets:
#   NES_DB_PUSH_TOKEN          - GitHub PAT with write access to nes-db repository
#   DATABASE_URL_PROXY         - PostgreSQL connection string via proxy (postgresql://user:pass@127.0.0.1:5432/db)
#   GOOGLE_APPLICATION_CREDENTIALS - Service Account JSON key with Cloud SQL Client role
#   CLOUD_SQL_INSTANCE         - Cloud SQL instance connection name (e.g. project:region:instance)
#   SECRET_KEY                 - Django secret key
#
# See .kiro/specs/nes-queue-system/ for full specification.

name: Process NES Queue

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering for testing and urgent processing

permissions:
  contents: read

jobs:
  process-queue:
    name: Process Approved Queue Items
    runs-on: ubuntu-latest
    environment: "NES DB update"

    steps:
      # -----------------------------------------------------------
      # 1. Checkout repositories
      # -----------------------------------------------------------
      - name: Checkout jawafdehi-api
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout nes-db
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Jawafdehi/NepalEntityService-database
          path: nes-db
          token: ${{ secrets.NES_DB_PUSH_TOKEN }}

      # -----------------------------------------------------------
      # 2. Start Cloud SQL Proxy
      # -----------------------------------------------------------
      - name: Start Cloud SQL Proxy
        uses: Jawafdehi/gce-cloudsql-proxy-action@master
        with:
          creds: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          instance: ${{ secrets.CLOUD_SQL_INSTANCE }}
          port: 5432

      # -----------------------------------------------------------
      # 3. Set up Python and dependencies
      # -----------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      # -----------------------------------------------------------
      # 4. Configure git for nes-db commits
      # -----------------------------------------------------------
      - name: Configure git identity for nes-db
        working-directory: nes-db
        run: |
          git config user.name "Jawafdehi NESQ Bot"
          git config user.email "nesq-bot@jawafdehi.org"

      # -----------------------------------------------------------
      # 5. Run the queue processor
      # -----------------------------------------------------------
      - name: Process approved queue items
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROXY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NES_DB_PATH: ${{ github.workspace }}/nes-db/v2
          DEBUG: 'False'
        run: poetry run python manage.py process_queue --verbose

      # -----------------------------------------------------------
      # 6. Show nes-db changes
      # -----------------------------------------------------------
      - name: Show nes-db changes
        working-directory: nes-db
        run: |
          echo "=== Changed files ==="
          git diff --stat
          echo ""
          echo "=== Full diff ==="
          git diff

      # -----------------------------------------------------------
      # 7. Commit and push nes-db changes
      # -----------------------------------------------------------
      - name: Commit and push NES changes
        working-directory: nes-db
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHANGED_FILES=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "Process NESQ items — ${CHANGED_FILES} file(s) updated"
            git push
          fi
