name: CI
on:
  push:
    branches: ['main*', 'develop*']
  pull_request:
    branches: ['main*', 'develop*']
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_jawafdehi
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-test-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      TESTING: "true"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_jawafdehi
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python + Poetry
        id: setup
        uses: ./.github/actions/setup-poetry-python
        with:
          python-version: '3.12'
          extras: 'llm-all'

      - name: Run pre-commit hooks
        run: poetry run pre-commit run --all-files

      - name: Check formatting
        run: ./scripts/format.sh --check

      - name: Collect static files
        run: poetry run python manage.py collectstatic --noinput

      - name: Run tests
        run: poetry run pytest -v --tb=short --maxfail=15 --durations=20
