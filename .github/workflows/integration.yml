# E2E integration gate: brings up the real platform stack, seeds it, and runs BOTH
# halves against it — the pytest API suite (HTTP contract) and the frontend
# Playwright suite (browser user-actions). This is the authoritative cross-repo
# E2E gate; it lives in the API repo because the compose file does.
#
# Mirrors the proven local flow (docker-compose.e2e.yml overlay, isolated ports):
#   build image -> up (no zitadel) -> --wait + health loop -> seed_dev ->
#   reindex_all --rebuild -> pytest (API) -> playwright (FE) -> artifacts -> down.
#
# Currently on workflow_dispatch + PR as a NON-BLOCKING signal (not a required
# check). Flip it to a required status check once it's proven stable in Actions.
name: integration-tests

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, v2]

# The FE repo to check out alongside for the Playwright half. The compose overlay
# and env file live at the API repo root — this workflow and every path below are
# resolved from that root (GitHub Actions only discovers workflows under the
# repo-root .github/workflows/, so the workflow lives here, not under
# integration-tests/; the API suite step sets working-directory: integration-tests).
env:
  FRONTEND_REPO: jawafdehi/jawafdehi
  FRONTEND_REF: main
  COMPOSE: -p jawaf-e2e --env-file docker-compose.e2e.env -f docker-compose.yml -f docker-compose.e2e.yml
  PLATFORM_BASE_URL: http://localhost:48010

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Action versions are SHA-pinned to match ci.yml / docker-publish-platform.yml
      # (a bare tag like setup-uv@v8 does not resolve).
      - name: Checkout API repo (owns the compose file)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout frontend repo (for the Playwright half)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: _frontend

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Build the platform image from THIS checkout
        run: docker build -t jawafdehi-platform:e2e -f Dockerfile .

      - name: Bring up the stack (no zitadel — dev-login replaces OIDC for E2E)
        run: |
          docker compose ${COMPOSE} up -d --wait \
            postgres opensearch minio platform-migrate platform

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf "${PLATFORM_BASE_URL}/api/health" && break
            sleep 3
          done
          curl -sf "${PLATFORM_BASE_URL}/api/health"

      - name: Seed + index
        run: |
          docker compose ${COMPOSE} exec -T platform uv run python manage.py seed_dev
          docker compose ${COMPOSE} exec -T platform uv run python manage.py reindex_all --rebuild

      - name: API integration tests (pytest, live stack)
        working-directory: integration-tests
        env:
          SKIP_IF_STACK_DOWN: "0"
        run: |
          uv sync --frozen || pip install -e .
          uv run pytest -v || pytest -v

      - name: Frontend E2E (Playwright, real backend via proxy)
        working-directory: _frontend
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:48010
        run: |
          # The Playwright suite lands on the FE trunk via its own PR; until it is
          # on FRONTEND_REF this step self-skips so the API half still gates and
          # the FE half auto-activates once the config is present on that ref.
          if [ ! -f playwright.config.ts ]; then
            echo "::notice::No playwright.config.ts on ${FRONTEND_REF} yet — skipping the FE half (see the frontend E2E PR)."
            exit 0
          fi
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bunx playwright test

      - name: Collect compose logs
        if: always()
        run: docker compose ${COMPOSE} logs > compose-logs.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            compose-logs.txt
            _frontend/playwright-report/**
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose ${COMPOSE} down -v
