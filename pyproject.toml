# Jawafdehi platform — ONE Django project, ONE installable package.
#
# NES, NGM and Jawafdehi run as Django *apps* in a single project (``config.settings``):
# one process, one ASGI entrypoint, one image. Database-per-service is preserved via DB routers
# (each app's models route to its own Postgres DB — see config/db_router.py).
#
# There is no uv workspace and no per-service packages: every app is a plain top-level
# import package (entities, courts, materials, lakehouse, cases, review, search,
# discovery, config, jawafdehi_shared) and all runtime deps live here.
#
#   uv sync                        # install the project (all apps) + dev tools
#   uv run python manage.py ...     # one manage.py, one settings, all apps

[project]
name = "jawafdehi"
version = "0.1.0"
description = "Jawafdehi platform — ONE Django project running NES, NGM and Jawafdehi as apps in one process (database-per-service preserved via DB routers)."
license = "LicenseRef-Hippocratic-3.0"
license-files = ["jawafdehi_mcp/LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # --- core web stack ---
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.9",
    "django-filter>=25.2",
    "drf-spectacular>=0.29",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.34,<1",
    "uvicorn-worker>=0.3,<1",
    "whitenoise>=6.11",
    # Prometheus /metrics (multiprocess-aware for the gunicorn workers).
    "django-prometheus>=2.3",
    # --- auth (OIDC/Zitadel in prod; the single OIDCAuthentication impl lives in
    # jawafdehi_shared) ---
    "pyjwt[crypto]>=2.10",
    "mozilla-django-oidc>=5.0.2",
    # --- databases (3 Postgres DBs via router; psycopg2 for jawafdehi DB, psycopg3
    # for nes/ngm) ---
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9.11",
    "dj-database-url>=3.0",
    # Client for the optional shared cache backend (django.core.cache RedisCache),
    # which backs DRF throttle counters when CACHE_URL is set — see the F14 note in
    # config/settings.py. Django imports this lazily on first cache use, so it must
    # be installed or the first throttled request 500s once CACHE_URL points at
    # Redis in prod.
    "redis>=5.0",
    # HTTP client for outbound REST calls (newsletter→SendPulse ESP; also used by
    # the cases enrichment management commands).
    "requests>=2.32",
    # Client for the OPTIONAL case-enrichment event bus. Pure Python and small.
    # Imported lazily inside case_events/bus.py, never at startup, and unused entirely
    # when NATS_URL is unset — but it ships in the base image because the
    # consumer Deployment runs off that image.
    "nats-py>=2.9",
    # The MCP tools' HTTP client, and a base dependency rather than an extra
    # because MCP runs inside the platform process. Embedded, it carries the
    # bounded ASGITransport that dispatches /api/ calls to Django in memory
    # (jawafdehi_mcp/api_transport.py); over stdio it is a plain remote client.
    # httpcore is a DIRECT import, and both bounds are deliberate: the document
    # converter's SSRF guard substitutes its own httpcore network backend into
    # httpx's private `_pool._network_backend`, so a validated address cannot be
    # re-resolved between check and connect while the URL host is still used for
    # Host/TLS SNI. That leans on internals of both projects, so a major bump of
    # either has to be reviewed rather than absorbed.
    "httpx>=0.28",
    "httpcore>=1.0,<2",
    # --- entities/materials (NES + NGM) ---
    "jsonpatch>=1.33",          # RFC-6902 PATCH /api/entities/{ref}
    # --- ngm lakehouse / object storage ---
    "duckdb>=1.4.0",
    "boto3>=1.35",              # R2/S3 (lakehouse data files + document-source storage)
    "django-storages>=1.14.3",
    # --- jawafdehi cases/review ---
    "django-jazzmin==3.0.1",
    "django-tinymce>=5.0",
    "rules>=3.5",               # django-rules permission predicates
    "django-auditlog>=3.3",
    "pydantic>=2.12",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.2",
    "anthropic>=0.40",
    "nepali>=1.2.0",            # Bikram Sambat date conversion
    "structlog>=25.5",
    "sentry-sdk>=2.0",
    # LLM clients used by casework enrichers (raw SDKs; LangChain stack dropped):
    "openai>=2.30,<3",
    "google-genai>=1.0",
    # --- unified search substrate (OpenSearch + Devanagari<->Latin transliteration) ---
    "opensearch-py>=2.4",
    "indic-transliteration>=2.3.82",
    # --- sourcing (materials.sourcing.nkp): HTML parsing for the NKP precedent
    # crawler. requests (HTTP transport) is already pulled in transitively. ---
    "lxml>=5.0",
    # --- headless CMS (Wagtail "Jawafdehi Newsroom" — public /updates section) ---
    # 7.4 is the current LTS; supports Django 5.2 + Python 3.12. Pulls in its own
    # deps (taggit, modelcluster, willow, etc.). wagtail-headless-preview 0.9
    # redirects the editor preview iframe to the SPA. markdown backs the one-time
    # seed_updates management command.
    "wagtail>=7.4,<7.5",
    "wagtail-headless-preview>=0.9,<0.10",
    "markdown>=3.5",
    # --- embedded Model Context Protocol server ---
    "mcp>=1.26,<2",
    "nepali-datetime>=1.0.8.4",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.5",
    "likhit",
    "google-cloud-logging>=3.12",
    "sqlglot>=26.33,<28",
]

[project.optional-dependencies]
# Compatibility alias retained for Dockerfile.consumer and existing developer
# commands. These packages are also base dependencies now because MCP runs in
# the platform process.
bigo-enrichment = [
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.5",
    "likhit",
]
# SOCKS5 support for the casework news search, used when the run happens on a
# host search engines refuse (datacentre address) and the queries are carried
# over an SSH reverse tunnel. Imported lazily and only when CASEWORK_SOCKS_PROXY
# is set, so the base image and every other code path are unaffected.
casework-proxy = [
    "PySocks>=1.7.1",
]

[tool.uv.sources]
# Shared by material enrichment and the embedded MCP document converter.
likhit = { git = "https://github.com/Jawafdehi/likhit.git", rev = "e98eb446437f8a086e1e8da409d413ca81106532" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# All app packages ship in the one wheel. `config` holds settings/urls/wsgi/asgi/
# db_router; `jawafdehi_shared` holds cross-cutting libs (auth/oidc, identity,
# middleware, logging_config, entities/ids, search, drf).
[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "case_proposals",
    "jawafdehi_shared",
    "entities",
    "courts",
    "materials",
    "lakehouse",
    "cases",
    "review",
    "newsletter",
    "jobs",
    "case_events",
    "llm",
    "jawafdehi_mcp",
    "search",
    "discovery",
    "content",
]

[tool.hatch.build.targets.wheel.force-include]
"jawafdehi_mcp/LICENSE" = "jawafdehi_mcp/LICENSE"

[dependency-groups]
# Dev tooling (lint/format/test). Not shipped in the image.
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-django>=4.8",
    # Jawafdehi's test suite needs these (its conftest imports hypothesis; some
    # tests are async).
    "hypothesis>=6.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.6.0",
    "ty>=0.0.66",
]

# ---------------------------------------------------------------------------
# ty (astral-sh) — type checking, ADVISORY, not yet a gate.
#
# Run it:  uv run ty check
#
# ty is pre-1.0 (0.0.66 here) and has NO Django plugin, so it cannot see what
# Django's model metaclass adds at runtime. Measured on this tree at the time of
# adoption: 1304 diagnostics, of which ~800 (61%) are that blind spot —
# 640 `X has no attribute objects` (the default Manager, injected by ModelBase)
# and 110 `has no attribute force_authenticate` (DRF's APIClient). Those are
# tool limitations, not defects in this code.
#
# So the rules below are OFF for now, and ty is ADVISORY rather than a gate: CI
# runs it with `|| true` (see ci.yml) and pre-commit does not run it at all. A
# gate that reports 800 false positives trains people to ignore it. What IS
# useful today is the 30 that remain once those families are silenced, which is
# why the checker is installed and configured rather than skipped.
#
# The path to a real gate, in order:
#   1. keep `unresolved-attribute` off until ty ships Django support (track
#      astral-sh/ty#255 "django plugin"), or add django-stubs and re-measure;
#   2. turn the small families on one at a time (`not-iterable`,
#      `missing-argument`, `invalid-method-override` are single digits today);
#   3. only then drop the `|| true` in ci.yml and add the hook to
#      .pre-commit-config.yaml.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# ruff — the lint gate (CI runs exactly `uv run ruff check .`).
#
# The default rule set (E4/E7/E9/F) stays as the tree-wide floor: this project
# has ~52k lines of source that predate any lint config, and switching families
# on globally would land ~500 findings in one go. Formatting stays ungated
# (`ruff format` would reflag ~150 legacy files).
#
# What IS enforced tree-wide beyond the defaults: BLE001. Every deliberate
# blind `except` already carries a `# noqa: BLE001` plus a reason (see
# AGENTS.md), so enabling it costs nothing today and makes a NEW unexplained
# blind catch fail the gate instead of accumulating.
#
# Annotation coverage (ANN, minus ANN401) is enforced per-directory, starting
# where the code already satisfies it rather than as an aspiration. Measured ANN
# findings by app at adoption: lakehouse 4 (all ANN401 + one missing return, now
# fixed), content 57, discovery 80, newsletter 82, case_proposals 105, jobs 122,
# llm 154, casework 329; ~2300 tree-wide. `lakehouse` is the beachhead — it is
# fully annotated and passes `ty check` clean. Add the next directory only after
# its `ruff check <dir> --select ANN` count is actually 0; a per-file-ignores
# entry that is always violated is not a gate.
#
# Verified at adoption that this scoping really is live: a `def f(x): return x`
# dropped in lakehouse/ fails with ANN001+ANN202, and the same file in cases/
# passes.
# ---------------------------------------------------------------------------
[tool.ruff.lint]
extend-select = ["BLE", "ANN"]
# ANN401 (a parameter or return annotated `Any`) is off everywhere. The places
# this tree reaches for `Any` are handles to genuinely untyped third-party
# objects -- a boto3 S3 client, a duckdb module, a BeautifulSoup node. `Any` is
# the honest annotation there, and the rule would only push people to delete the
# annotation entirely, which ANN001/ANN201 then flag. Coverage is what is being
# enforced; precision on foreign objects is not available to enforce.
extend-ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# ruff has no "select this rule for one path only" primitive, so ANN is selected
# globally above and switched OFF everywhere except the directories that already
# satisfy it. Deleting a line here is how a directory opts IN — do that only
# once its `ruff check <dir> --select ANN` count is 0.
"cases/**" = ["ANN"]
"casework/**" = ["ANN"]
"case_proposals/**" = ["ANN"]
# case_events landed upstream (the NATS bus + pull consumers) after ANN was
# switched on, with 81 findings — same treatment as every other directory here.
"case_events/**" = ["ANN"]
"config/**" = ["ANN"]
"content/**" = ["ANN"]
"courts/**" = ["ANN"]
"discovery/**" = ["ANN"]
"entities/**" = ["ANN"]
"jawafdehi_shared/**" = ["ANN"]
"jobs/**" = ["ANN"]
"llm/**" = ["ANN"]
"materials/**" = ["ANN"]
"newsletter/**" = ["ANN"]
"review/**" = ["ANN"]
"search/**" = ["ANN"]
"integration-tests/**" = ["ANN"]
# Tests stay exempt permanently: annotating ~42k lines of test bodies buys
# nothing (pytest does not read them) and ANN401 would fight every fixture.
"tests/**" = ["ANN"]
"**/tests/**" = ["ANN"]
"**/test_*.py" = ["ANN"]
"**/conftest.py" = ["ANN"]
"manage.py" = ["ANN"]
# `lakehouse/**` is deliberately absent: it is the one directory where ANN is
# ENFORCED. Keep it that way.

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# Never type-check the venv, build artifacts, or migrations. Migrations are
# generated code; `ty` flags ~30 diagnostics in them that no one should fix.
exclude = [
    ".venv",
    "build",
    "staticfiles",
    "**/migrations/**",
    "integration-tests",
]

[tool.ty.rules]
# --- Django/DRF blind spots: off until ty understands the metaclass. ---
unresolved-attribute = "ignore"
# `Model.objects.filter(...)` returns Any to ty, so anything derived from a
# queryset trips these three.
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
# Django settings are assembled dynamically (`from config.settings import *`),
# and test doubles are assigned over typed attributes on purpose.
invalid-assignment = "ignore"
# Optional third-party imports guarded by try/except ImportError (markitdown,
# indic_transliteration) legitimately do not resolve in every environment.
unresolved-import = "ignore"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Custom markers. ``security`` tags the adversarial / penetration-test suite
# (IDOR, role escalation, injection, data-exposure, abuse) so it can be run on its
# own: ``uv run pytest -m security``. These run in the normal sqlite unit gate.
markers = [
    "security: adversarial / penetration-oriented tests (run with -m security)",
]
# Each app owns its own ``tests`` package (entities/tests, courts/tests,
# materials/tests, cases/tests, …) so test module names are unique — no collision,
# no __init__.py/sys.path juggling needed. The Jawafdehi suite lives at the repo-root
# ``tests`` package (``from tests.conftest import ...`` still resolves).
