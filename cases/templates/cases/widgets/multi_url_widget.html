<div id="{{ widget_id }}_container" class="multiple-input-container">
    {% for value in values %}
    <div class="input-row" draggable="true">
        <span class="drag-handle">⋮⋮</span>
        <input type="url" class="url-input" value="{{ value.link }}" placeholder="https://example.com">
        <select class="url-role" aria-label="Link type">
            {% for r in role_choices %}
            <option value="{{ r }}" {% if value.role == r or value.role == None and r == "RAW" %}selected{% endif %}>{{ r }}</option>
            {% endfor %}
        </select>
        <button type="button" class="btn btn-sm btn-danger remove-input" aria-label="Remove URL">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
    {% endfor %}
    <div style="margin-bottom: 8px;">
        <button type="button" id="{{ widget_id }}_add" class="btn btn-sm btn-success add-widget-btn" aria-label="{{ button_label }}">
            <i class="fas fa-plus" aria-hidden="true"></i> {{ button_label }}
        </button>
    </div>
</div>
<input type="hidden" name="{{ name }}" id="{{ widget_id }}" value="{{ values_json }}">

{% comment %}Role choices as JSON (json_script safely escapes for embedding) so the new-row
template builds the <select> in JS without interpolating values into JS source.{% endcomment %}
{{ role_choices|json_script:role_choices_id }}

<script>
(function () {
    var roleChoices = JSON.parse(
        document.getElementById('{{ role_choices_id }}').textContent
    );
    // No blank option — role is mandatory; new rows default to the first
    // choice (RAW), matching the rendered existing-row selects above.
    var roleOptions = roleChoices.map(function (r) {
        var opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        return opt.outerHTML;
    }).join('');

    window.initMultiWidget(
        '{{ widget_id }}_container',
        '{{ widget_id }}',
        'url',
        {
            rowTemplate: [
                '<span class="drag-handle">⋮⋮</span>',
                '<input type="url" class="url-input" placeholder="https://example.com">',
                '<select class="url-role" aria-label="Link type">' + roleOptions + '</select>',
                '<button type="button" class="btn btn-sm btn-danger remove-input" aria-label="Remove URL">',
                '<i class="fas fa-times" aria-hidden="true"></i>',
                '</button>'
            ].join(' ')
        }
    );
})();
</script>
