# Pre-commit hooks for the jawafdehi-api monolith (uv project).
# Install once per clone:  uv run pre-commit install
#
# Gating policy, unchanged: `ruff check` only. Formatting is intentionally NOT
# gated (see .github/workflows/ci.yml; `ruff format` would reflag ~150 legacy
# files), and the base hooks below are non-mutating checks only.
#
# The ruff hook is the official astral-sh/ruff-pre-commit mirror, PINNED to the
# exact version in uv.lock. That pin is the point: this replaced a `local` hook
# that shelled out to `uv run ruff check`, whose stated advantage was "no
# separately-pinned mirror version to drift" — but which silently changed
# behaviour whenever `uv sync` moved ruff, and required a working project venv
# just to lint. The mirror is hermetic (pre-commit builds its own env) and its
# version is reviewable in a diff.
#
# WHEN BUMPING RUFF: change `rev` here and the `ruff>=` floor in pyproject.toml
# together, then re-run `uv lock`. A mismatch means pre-commit and CI can
# disagree — `uv run ruff --version` must equal the `rev` below.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # No `args:` needed — the mirror's own hook definition already passes
      # --force-exclude (passing it again is a hard error: "the argument
      # '--force-exclude' cannot be used multiple times").
      - id: ruff-check

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml

  # ty is now a hook, and a `local` one — deliberately unlike the pinned ruff
  # mirror above. That is not inconsistency: ty has to RESOLVE this project's
  # third-party types (django-stubs, drf-stubs, django, DRF, wagtail, every
  # runtime dep) to say anything useful, and a pre-commit-managed isolated env
  # contains none of them. A mirror hook would report the whole tree as
  # unresolved imports. Hermeticity is simply not on offer here; the project venv
  # is the only environment in which the answer is correct.
  #
  # `pass_filenames: false` because the check is whole-project: ty needs the
  # cross-module view, and the per-path scoping in [tool.ty.overrides] is keyed on
  # paths it discovers itself.
  #
  # `files` covers pyproject.toml and uv.lock as well as sources, and neither is
  # incidental. The obvious `types: [python]` looks right and is subtly wrong on
  # both counts:
  #
  #   pyproject.toml HOLDS the [tool.ty] config, so under a python-only trigger a
  #   commit that loosens a rule, widens an override, or drops a whole block skips
  #   the very check it just weakened.
  #
  #   uv.lock pins ty ITSELF, plus django-stubs, drf-stubs and every dep whose
  #   types ty reads. A dependency bump therefore changes what the checker is and
  #   what it knows while touching no `.py` file at all — upstream #436
  #   (`chore(deps): bump likhit`) is exactly that shape. #436 also moved a
  #   `pyproject.toml` line, so the pyproject entry alone would have caught it;
  #   what the uv.lock entry adds is the bump that DOESN'T, i.e. a plain
  #   `uv lock --upgrade` refresh, which moves pinned versions and nothing else.
  #
  # Both entries were verified the same way, and it is worth repeating if you
  # change this regex: run `pre-commit run ty --files <the file>` against the
  # config WITHOUT the entry and it reports "no files to check" and passes, which
  # is the failure — then add the entry and the same command actually runs ty.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        files: '(\.pyi?$|^pyproject\.toml$|^uv\.lock$)'
        pass_filenames: false
