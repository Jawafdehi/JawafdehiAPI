[project]
name = "jawafdehi-shared"
version = "0.1.0"
description = "Shared libraries for the Jawafdehi platform: OIDC auth, entity-id contract, OpenSearch helpers, DRF bases."
requires-python = ">=3.12"
dependencies = [
    # Auth is intrinsic to the shared package (every service uses it).
    "django>=5.0",
    "djangorestframework>=3.15",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# Services that use search pull this in; keeps opensearch optional for those that
# don't. indic-transliteration (MIT) is the single shared Devanagari<->Latin
# transliteration backend used by all index-time indexers (see search/transliterate.py).
search = ["opensearch-py>=2.4", "indic-transliteration>=2.3.82"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jawafdehi_shared"]
